services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: magic_english
      POSTGRES_USER: magic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magic -d magic_english"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://magic:${POSTGRES_PASSWORD}@postgres:5432/magic_english?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: https://${DOMAIN},https://${LANDING_DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      ACTIVITY_HASH_SECRET: ${ACTIVITY_HASH_SECRET}
      FEED_UPLOAD_DIR: /app/uploads/feed
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Magic English <accounts@magic-english-academy.com>}
      ALFA_API_URL: ${ALFA_API_URL:-https://ecom.alfabank.by/payment/rest}
      ALFA_USERNAME: ${ALFA_USERNAME:-}
      ALFA_PASSWORD: ${ALFA_PASSWORD:-}
      ALFA_TOKEN: ${ALFA_TOKEN:-}
      ALFA_RETURN_URL: ${ALFA_RETURN_URL:-https://magic-english-plan.by/payment/success}
      ALFA_FAIL_URL: ${ALFA_FAIL_URL:-https://magic-english-plan.by/payment/failed}
      ALLOW_DEV_AUTH: "false"
    volumes:
      - feed_uploads:/app/uploads/feed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
        NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL}
        NEXT_PUBLIC_DEMO_MODE: "false"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  landing:
    build:
      context: ..
      dockerfile: landing/Dockerfile
      args:
        PLATFORM_URL: https://${DOMAIN}
        CONTACT_URL: ${CONTACT_URL:-https://t.me/mag_english}
        LANDING_CANONICAL_URL: https://${LANDING_DOMAIN}
        PAYMENT_API_URL: https://${LANDING_DOMAIN}/api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      LANDING_DOMAIN: ${LANDING_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - landing

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  feed_uploads:
