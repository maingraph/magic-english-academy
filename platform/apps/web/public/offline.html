<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f29a16">
    <title>Magic English — нет сети</title>
    <style>
      @font-face{font-family:Montserrat;src:url("/fonts/Montserrat-Regular.woff2")}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#fffefa;color:#17140f;font-family:Montserrat,Arial,sans-serif}.card{width:min(520px,100%);padding:42px;border:1px solid rgba(211,166,70,.34);border-radius:28px;background:#fff;box-shadow:0 24px 80px rgba(91,65,16,.11);text-align:center}.mark{display:grid;width:62px;height:62px;margin:0 auto 22px;place-items:center;border-radius:50%;background:linear-gradient(135deg,#f7b547,#e67d00);color:#fff;font-size:28px}h1{margin:0 0 12px;font-size:30px}p{margin:0;color:#6b655d;line-height:1.6}button{margin-top:24px;padding:13px 20px;border:0;border-radius:999px;background:#f29a16;color:#fff;font:700 14px Montserrat;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark">✦</span>
      <h1>Связь пропала</h1>
      <p>Проверь интернет и попробуй снова. Данные курса не будут отправлены или изменены без подключения.</p>
      <button onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
