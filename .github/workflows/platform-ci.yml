name: Platform CI

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: magic_english
          POSTGRES_USER: magic
          POSTGRES_PASSWORD: magic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magic -d magic_english"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://magic:magic@localhost:5432/magic_english?schema=public
      WEB_ORIGIN: http://localhost:3000
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      SETTINGS_ENCRYPTION_KEY: ci-settings-secret-at-least-32-characters
      ACTIVITY_HASH_SECRET: ci-activity-secret-at-least-32-characters
      ALLOW_DEV_AUTH: "false"
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm exec -w @magic-english/api -- prisma validate --schema prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - run: npm exec -w @magic-english/api -- prisma migrate deploy --schema prisma/schema.prisma
      - run: npm run db:seed
      - name: Start API
        run: |
          node apps/api/dist/main.js > /tmp/magic-api.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://localhost:4000/api/health && exit 0
            sleep 1
          done
          cat /tmp/magic-api.log
          exit 1
      - run: npm run smoke:api
